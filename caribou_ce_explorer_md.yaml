app_name: Caribou Cumulative Effects Explorer

version: 1.0

purpose: "R shiny application that enables users to evaluate disturbance cumulative effect in caribou ranges and corridors overlapping the LFN IPCA planning area."
  
other:   "The application allow to generate human footprint or landscape intactness maps using regional-scale anthropogenic surface disturbance data at the caribou range/corridor. The application includes 
data for 10 caribou herds: Coal River, Finlayson, Horseranch, Labiche, Little Rancheria, Pelly, Redstone, South Nahanni, Tay River and Wolf Lake.

For each herd, the application compiles a consistent set of spatial layers used to represent both natural and anthropogenic disturbances, as well as land use context. These layers are used within the app to visualize 
disturbance patterns, support comparisons under different scenarios, and enable cumulative effects assessment. It is possible for the user to add extra linear and/or areal disturbances as well as display elements as vector and/or raster 
format. It also produces a summary report documenting the analysis parameters and outputs used to generate the undisturbed areas map. Users can export summary statistics in CSV format, as well as GeoPackages containing disturbed and undisturbed area maps for use in GIS software
 such as QGIS or ArcGIS."

access: "https://beaconsproject.shinyapps.io/Caribou_CE_Explorer/"

