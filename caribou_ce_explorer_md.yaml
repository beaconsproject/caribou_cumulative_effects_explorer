required_columns:
  CaribouHerds:
    HERD:
      used_by:
        - Caribou CE Explorer
      format: character
      allow_null: false
      expected_values:
        - Little Rancheria
        - Coal River
        - Finlayson
        - Horseranch
        - Labiche
        - Liard Plateau
        - Pelly
        - Redstone
        - South Nahanni
        - Swan Lake
        - Tay River
        - Wolf Lake
      description: "Used by leaflet to map caribou herds."
  proposed_ipcas_all:
    ipca_name:
      used_by:
        - Caribou CE Explorer
      format: character
      allow_null: false
      expected_values:
        - Little Rancheria
        - Dene K'éh Kusān
        - Ross River MOU IPCA Study Area
        - Toobally
        - Tū Chō
      description: "Used by leaflet to map IPCA."
  linear_disturbances:
    TYPE_INDUSTRY:
      used_by:
        - Caribou CE Explorer
      format: character
      allow_null: true
      expected_values:
      description: "Used to classify industry type in the demo dataset"
    TYPE_DISTURBANCE:
      used_by:
        - Caribou CE Explorer
      format: character
      allow_null: true
      expected_values:
      description: "Used to classify disturbance type in the demo dataset"
  areal_disturbances:
    TYPE_INDUSTRY:
      used_by:
        - Caribou CE Explorer
      format: character
      allow_null: true
      expected_values:
      description: "Used to classify industry type in the demo dataset"
    TYPE_DISTURBANCE:
      used_by:
        - Caribou CE Explorer
      format: character
      allow_null: true
      expected_values:
      description: "Used to classify disturbance type in the demo dataset"
  fires:
    YEAR:
      used_by:
        - Caribou CE Explorer
      format: integer
      allow_null: false
      expected_values:
      description: "Used to filter fires by year range"
    CAUSE:
      used_by:
        - Caribou CE Explorer
      format: character
      allow_null: true
      expected_values:
        - Human
        - Natural
        - Undetermined
      description: "Used by leaflet to map fires."

